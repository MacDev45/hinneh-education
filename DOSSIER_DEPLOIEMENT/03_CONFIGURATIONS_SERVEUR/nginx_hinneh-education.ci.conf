# Configuration Nginx de Production — hinneh-education.ci
server {
    listen 80;
    server_name hinneh-education.ci www.hinneh-education.ci;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hinneh-education.ci www.hinneh-education.ci;

    root /var/www/hinneh-education.ci/frontend;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8011/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    location ~* ^/(docs|redoc|openapi.json) {
        proxy_pass http://127.0.0.1:8011;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:8011/uploads/;
        proxy_set_header Host $host;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /error.html;
    location = /error.html {
        root /var/www/hinneh-education.ci/frontend;
        internal;
    }
}
