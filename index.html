<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HINNEH ÉDUCATION</title>
    <meta name="description" content="HINNEH ÉDUCATION - Plateforme de gestion scolaire" />
    <meta name="author" content="Fondation Hinneh / COSIM" />
    <link rel="icon" type="image/png" href="/images/hinneh_logo_20260507_234919.png" />

    <meta property="og:title" content="HINNEH ÉDUCATION" />
    <meta property="og:description" content="HINNEH ÉDUCATION - Plateforme de gestion scolaire" />
    <meta property="og:type" content="website" />
  </head>

  <body>
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; width: 100vw; background-color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 20px; box-sizing: border-box;">
        <style>
          @keyframes hinneh-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
          @keyframes hinneh-pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.85; transform: scale(1.05); } }
          @keyframes hinneh-bar { 0% { transform: translateX(-100%); } 100% { transform: translateX(200%); } }
          .hinneh-loader-wrapper { position: relative; width: 80px; height: 80px; display: flex; align-items: center; justify-content: center; }
          .hinneh-spin-ring { position: absolute; inset: -6px; border-radius: 50%; border: 3px solid #e2e8f0; border-top-color: #2563eb; border-bottom-color: #4f46e5; animation: hinneh-spin 1.4s linear infinite; }
          .hinneh-logo-box { position: relative; z-index: 2; width: 68px; height: 68px; border-radius: 50%; background: #ffffff; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; padding: 10px; box-sizing: border-box; }
          .hinneh-logo-img { width: 100%; height: 100%; object-fit: contain; animation: hinneh-pulse 2.5s ease-in-out infinite; }
          .hinneh-track { width: 160px; height: 4px; background: #e2e8f0; border-radius: 9999px; overflow: hidden; position: relative; margin-top: 14px; }
          .hinneh-progress { position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: linear-gradient(90deg, #2563eb, #4f46e5, #10b981); border-radius: 9999px; animation: hinneh-bar 1.5s ease-in-out infinite; }
        </style>
        <div class="hinneh-loader-wrapper">
          <div class="hinneh-spin-ring"></div>
          <div class="hinneh-logo-box">
            <img src="/images/hinneh_logo_20260507_234919.png" alt="Logo Hînneh" class="hinneh-logo-img" />
          </div>
        </div>
        <div style="margin-top: 18px; font-weight: 700; font-size: 13px; color: #1e3a8a; letter-spacing: 0.08em; text-transform: uppercase;">
          GROUPE SCOLAIRE CONFESSIONNEL HÎNNEH
        </div>
        <div style="margin-top: 6px; font-size: 12px; color: #64748b; font-weight: 500;">
          Chargement de l'application...
        </div>
        <div class="hinneh-track">
          <div class="hinneh-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
